name: eval-gate
on: [pull_request]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml langfuse

      - name: 运行评估脚本，生成report.json
        run: python eval_runner.py --dataset golden_100.yaml

      - name: 读取评估报告，对比基线
        run: |
          score=$(jq .avg_score report.json)
          baseline=2.8
          echo "本次平均分 = $score"
          echo "基线阈值 = $baseline"
          if (( $(echo "$score < $baseline" | bc -l) )); then
            echo "❌ 评估分数低于基线，拦截本次PR合并！"
            exit 1
          fi
